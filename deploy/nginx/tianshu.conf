# MinerU Tianshu - Nginx 反向代理配置（脱敏模板）
# 说明：
#   - <SERVER_IP> 请替换为你服务器的公网 IP
#   - 后端 API 在 8000、MCP 在 8002、前端 dist 在 <PROJECT_ROOT>/frontend/dist
#   - 需在 /etc/nginx/mime.types 的 application/javascript 一行追加 mjs（若无）

# MCP 上游 keep-alive 连接池（复用到 MCP 服务的连接）
upstream tianshu_mcp {
    server 127.0.0.1:8002;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 前端静态产物
    root /opt/mineru-tianshu/frontend/dist;
    index index.html;

    # 长连接/keep-alive 更稳（MCP SSE / POST 复用连接所需）
    keepalive_requests 10000;
    keepalive_timeout 3600s;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 让 .mjs (ES Module) 强制重新下载，避免浏览器缓存旧的错误 MIME 导致 PDF.js worker 加载失败
    location ~*\.mjs$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1g;
    }

    # FastAPI 文档
    location = /docs { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location = /redoc { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }

    # MCP Server (SSE) 反向代理
    location /sse {
        proxy_pass http://tianshu_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /messages {
        proxy_pass http://tianshu_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1g;
    }
}
